<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nascimento</title> 
    <link rel="stylesheet" href="assets/style.css">
    <script src="js/script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Story+Script&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Bem-vindo ao site de Nascimento</h1>
    
    <!-- Sem atributos style inline -->
    <h2 id="mensagem"></h2>

    <form class="Nascimento" onsubmit="calcularIdade(); return false;">
        
        <div class="nasdia">
            <label for="txtdia">Informe o dia:</label>
            <input type="text" id="txtdia" name="txtdia" required><br><br>
        </div>

        <div class="txtmes">
            <label for="txtmes">Informe o mês:</label>
            <input type="text" id="txtmes" name="txtmes" required><br><br>
        </div>

        <div class="txtano">
            <label for="txtano">Informe o ano:</label>
            <input type="text" id="txtano" name="txtano" required><br><br>
        </div>

        <div class="mostrarMes">
            <label for="MostrarMes">Mês de Nascimento:</label>
            <input type="text" id="MostrarMes" name="MostrarMes" readonly><br><br>
        </div>
        
        <div class="mostrarDiaSemana">
            <label for="txtdia_semana">Dia da Semana:</label>
            <input type="text" id="txtdia_semana" name="txtdia_semana" readonly><br><br>
        </div>

        <div class="mostrarIdade">
            <label for="txtidade">Idade:</label>
            <input type="text" id="txtidade" name="txtidade" readonly><br><br>
        </div>

        <!-- Bloco do Signo limpo -->
        <div class="mostrarSigno">
            <label>Signo:</label>
            <div class="card-signo">
                <span id="txtsigno"></span>
                <div class="box-imagem">
                    <img src="" alt="" id="signo">
                </div>
            </div>
            <br>
        </div>

        <div class="mostrarAnoBissexto">
            <label for="txtano_bissexto">Ano Bissexto:</label>
            <input type="text" id="txtano_bissexto" readonly><br><br>
        </div>

        <div class="botoes">
            <input type="submit" value="Exibir">
            <input type="reset" value="Limpar" onclick="limparSigno()">
        </div>

    </form>
</body> 
</html>
